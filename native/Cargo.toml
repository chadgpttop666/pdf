[package]
name = "pdf-reader-tts"
version = "1.0.0"
edition = "2021"
description = "Ускоритель озвучки PDF-читалки: синтез TeraTTS вне браузера"
license = "MIT"
publish = false

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
