[package]
name = "pdf-reader-tts"
version = "1.6.0"
edition = "2021"
description = "Ускоритель озвучки PDF-читалки: синтез TeraTTS вне браузера"
license = "MIT"
publish = false

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
# Расшифровка голосовых заметок (whisper.cpp, собирается из исходников через CMake).
whisper-rs = "0.16"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# Кнопки наушников во время примечания (media_keys.rs): клавиши и громкость системы.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Имя и версия в свойствах файла: в «Диспетчере задач» видно, что это за программа.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
