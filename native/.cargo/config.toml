# Программа для Windows — без зависимости от Visual C++ Redistributable:
# библиотека C вшита. (ONNX Runtime она нужна — её DLL кладутся рядом, см. build.rs.)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# whisper.cpp (расшифровка заметок) по умолчанию собирается под процессор
# машины сборки — у раннера GitHub это может быть AVX-512, и у людей программа
# падала бы. Собираем под AVX2 и FMA (процессоры с 2013 года); на более старых
# помощник честно говорит, что расшифровка недоступна (speech::supported).
# Библиотека C — статически, как у самой программы. Привязки к whisper.cpp
# bindgen делает на каждой системе свои (готовые в whisper-rs — linux-овые,
# на Windows не сходятся размеры структур); нужен libclang — на раннерах
# GitHub он есть.
[env]
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
GGML_BMI2 = "ON"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
# whisper.cpp объявляет CMake 3.5 — без этой политики предыдущая строка
# не действует, и он собирается с динамической библиотекой C (/MD).
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
# На Windows ещё нужны CMAKE_C_FLAGS_RELEASE / CMAKE_CXX_FLAGS_RELEASE =
# "-O2 -Ob2 -DNDEBUG" — иначе whisper.cpp без оптимизации (их задаёт
# .github/workflows/helper.yml; здесь нельзя — gcc таких флагов не знает).
