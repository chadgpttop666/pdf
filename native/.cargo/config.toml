# Программа для Windows — без зависимости от Visual C++ Redistributable:
# библиотека C вшита. (ONNX Runtime она нужна — её DLL кладутся рядом, см. build.rs.)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# whisper.cpp (расшифровка заметок) по умолчанию собирается под процессор
# машины сборки — у раннера GitHub это может быть AVX-512, и у людей программа
# падала бы. Собираем под AVX2 и FMA (процессоры с 2013 года); на более старых
# помощник честно говорит, что расшифровка недоступна (speech::supported).
# Библиотека C — статически, как у самой программы; привязки — готовые,
# без libclang на машине сборки.
[env]
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
GGML_BMI2 = "ON"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
WHISPER_DONT_GENERATE_BINDINGS = "1"
